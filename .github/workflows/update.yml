name: add-ticker

# 網頁上的「＋新增股票」／「移除這檔」會開一張 Issue，這個流程負責處理它。
# 只認 repo 擁有者開的 Issue —— 公開 repo 誰都能開 Issue，
# 沒有這道檢查等於讓任何人改你的觀察清單、燒你的 API 額度。
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 每張 Issue 自成一組。共用一組的話，同時開兩三張 Issue 會有人被
# 「higher priority waiting request」擠掉——同一組只准一個在跑、一個在等，
# 第三個會被取消。推送衝突交給下面的 Commit 步驟自己重試處理。
concurrency:
  group: add-ticker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parse issue
        run: python add_ticker.py

      # 只有新增才需要去外面抓資料。移除與改等級都只動 tickers.csv，
      # add_ticker.py 已經把 data/ 一起處理好了，重建就行，省掉三到五分鐘。
      - name: Sync
        if: success() && env.ACTION == 'add'
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sync.py

      - name: Classify
        if: success() && env.ACTION == 'add'
        run: python classify.py

      - name: Build web data
        if: success() && env.ACTION != 'none'
        run: python export_json.py

      - name: Build Excel
        if: success() && env.ACTION != 'none'
        run: python build_xlsx.py

      - name: Recalculate formulas
        if: success() && env.ACTION != 'none'
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          fi
          python recalc_xlsx.py "美股觀察表.xlsx"

      - name: Commit
        if: success() && env.ACTION != 'none'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "stock-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ docs/ tickers.csv "美股觀察表.xlsx"
          # 注意：`git diff --quiet || cmd` 在 bash -e 底下，
          # 「沒有變更」那條路會讓整個步驟以 1 結束。要用 if。
          if git diff --staged --quiet; then
            echo "沒有任何變更，不需要 commit"
            exit 0
          fi
          git commit -m "${ACTION}: ${TICKER}"
          # 這段期間 main 可能已經前進（你在網頁上改了檔案、或另一個流程剛推完），
          # 直接 push 會被拒。先試乾淨的合併——多數情況雙方改的檔案不重疊，
          # 這樣兩邊的東西都會留著。真的撞在同一行才退而求其次用這次的版本，
          # 因為 data/ docs/ 與 Excel 都是重跑就會一致的產物。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "推送被拒（第 $i 次），把遠端的變更接上來再試"
            if ! git pull --no-rebase --no-edit origin "$BRANCH"; then
              echo "有檔案撞在一起，這幾個產物以本次結果為準"
              git merge --abort || true
              git pull --no-rebase --no-edit -X ours origin "$BRANCH"
            fi
            sleep 3
          done
          echo "::error::連續三次推不上去，請看 Actions 是否有其他流程同時在寫入"
          exit 1

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" != "success" ]; then
            gh issue comment "$NUM" --body \
              "⚠️ 這次沒有處理成功（${STATUS}），清單沒有被更動。請看 Actions 的紀錄。修好之後把這張 Issue 關掉重開一張就會再跑一次。"
            exit 0
          fi
          gh issue comment "$NUM" --body "${RESULT:-已處理完成。}"
          gh issue close "$NUM"
