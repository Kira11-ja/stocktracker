name: update-stock-data

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: '只跑這幾檔（逗號分隔，留空＝全部）'
        required: false
      force_full:
        description: '忽略快取全部重抓（true / false）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ONLY: ${{ inputs.only }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$FORCE_FULL" = "true" ]; then ARGS="$ARGS --force-full"; fi
          echo "執行：python sync.py $ARGS"
          python sync.py $ARGS

      - name: Build Excel
        run: python build_xlsx.py

      - name: Recalculate formulas
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          fi
          python recalc_xlsx.py "美股觀察表.xlsx"



      - name: Commit
        run: |
          git config user.name  "stock-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ "美股觀察表.xlsx"
          git diff --staged --quiet || git commit -m "data: $(date -u +%F)"
          git push
